<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Point Cloud Viewer</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
        import * as THREE from "three";
        import { PLYLoader } from "three/addons/loaders/PLYLoader.js";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";

        const loader = new PLYLoader();
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0xeeeeee, 1); // Set background color to light gray
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x404040); // soft white light
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(1, 1, 1).normalize();
        scene.add(directionalLight);
        const controls = new OrbitControls(camera, renderer.domElement);

        loader.load('point_cloud.ply', function (geometry) {
            console.log('Geometry loaded:', geometry);
            const colors = geometry.attributes.color;
            const material = new THREE.PointsMaterial({ vertexColors: !!colors, size: 0.1 });
            const points = new THREE.Points(geometry, material);
            geometry.scale(10, 10, 10); // Scale the geometry up by a factor of 10
            geometry.rotateZ(-Math.PI / 2); // Rotate 90 degrees counterclockwise around the Z-axis
            geometry.center(); // Center the geometry
            scene.add(points);
            controls.update();
        });

        camera.position.set(0, 0, 50);
        camera.lookAt(0, 0, 0);

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
