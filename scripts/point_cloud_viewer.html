<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Point Cloud Viewer</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
        import * as THREE from "three";
        import { PLYLoader } from "three/addons/loaders/PLYLoader.js";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";

        const loader = new PLYLoader();
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0xeeeeee, 1); // Set background color to light gray
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);

        loader.load('point_cloud.ply', function (geometry) {
            const colors = geometry.attributes.color;
            const material = new THREE.PointsMaterial({ vertexColors: !!colors, size: 3  });
            const points = new THREE.Points(geometry, material);
            geometry.rotateZ(-Math.PI / 2); // Rotate 90 degrees counterclockwise around the Z-axis
            geometry.rotateX(-Math.PI / 12);
            geometry.center(); // Center the geometry
            scene.add(points);
        });

        camera.position.set(0, 0, 100);
        camera.lookAt(0, 0, 0);

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
