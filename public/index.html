<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link type="text/css" rel="stylesheet" href="main.css">
  </head>
  <body>
    <div id="container"></div>
    <script src="/ammo.wasm.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import Stats from "three/addons/libs/stats.module.js";
      import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';
      import { MTLLoader } from "three/addons/loaders/MTLLoader.js";
      import { OBJLoader } from "three/addons/loaders/OBJLoader.js";

      let physicsWorld, transformAux1;
      const rigidBodies = [];
      const clock = new THREE.Clock();
      //const updateMs = 20;

      Ammo().then((AmmoLib) => {
        Ammo = AmmoLib;
        setupPhysicsWorld();
        setupPlayerPhysics();
        loadLevel();
      });

      const setupPhysicsWorld = () => {
        const collisionConfiguration = new Ammo.btDefaultCollisionConfiguration();
        const dispatcher = new Ammo.btCollisionDispatcher(collisionConfiguration);
        const broadphase = new Ammo.btDbvtBroadphase();
        const solver = new Ammo.btSequentialImpulseConstraintSolver();

        physicsWorld = new Ammo.btDiscreteDynamicsWorld(
          dispatcher,
          broadphase,
          solver,
          collisionConfiguration,
        );
        physicsWorld.setGravity(new Ammo.btVector3(0, -9.8, 0));

        Ammo.btGImpactCollisionAlgorithm.prototype.registerAlgorithm(physicsWorld.getDispatcher());


        transformAux1 = new Ammo.btTransform();
      };

      const createRigidBody = (threeObject, physicsShape, mass, pos, quat) => {
        const transform = new Ammo.btTransform();
        transform.setIdentity();
        transform.setOrigin(new Ammo.btVector3(pos.x, pos.y, pos.z));
        transform.setRotation(new Ammo.btQuaternion(quat.x, quat.y, quat.z, quat.w));
        const motionState = new Ammo.btDefaultMotionState(transform);

        const localInertia = new Ammo.btVector3(0, 0, 0);
        physicsShape.calculateLocalInertia(mass, localInertia);

        const rbInfo = new Ammo.btRigidBodyConstructionInfo(
          mass,
          motionState,
          physicsShape,
          localInertia,
        );
        const body = new Ammo.btRigidBody(rbInfo);

        threeObject.userData.physicsBody = body;

        if (mass > 0) {
          rigidBodies.push(threeObject);
          body.setActivationState(4);
        }

        physicsWorld.addRigidBody(body);
        return body;
      };

      const removeRigidBody = threeObject => {
        const body = threeObject.userData.physicsBody;
        physicsWorld.removeRigidBody(body);

        const idx = rigidBodies.indexOf(threeObject);
        if (idx > -1) {
          rigidBodies.splice(idx, 1);
        }
      };

      const meshToConvexHull = (mesh) => {
        const { position } = mesh.geometry.attributes;
        const points = Array.from({ length: position.count }, (_, i) =>
          new THREE.Vector3(position.getX(i), position.getY(i), position.getZ(i))
        );
        const geometry = new ConvexGeometry(points);

        const material = new THREE.MeshPhongMaterial( { color: 0x00ff00 } );
        return new THREE.Mesh( geometry, material );
      };

      const getMeshData = (mesh, useConvex) => {
        /*if (useConvex) {
          mesh = meshToConvexHull(mesh);
        }*/

        const index = mesh.geometry.index !== null ? mesh.geometry.index : undefined;
        const attributes = mesh.geometry.attributes;
        const scale = mesh.scale;

        if (attributes.position === undefined) {
          console.error("getMeshData(): Position attribute required for conversion.");
          return;
        }

        const position = attributes.position;

        let vertices = [];
        let faces = [];

        for (let i = 0; i < position.count; i++) {
          vertices.push({
            x: scale.x * position.getX(i),
            y: scale.y * position.getY(i),
            z: scale.z * position.getZ(i),
          });
        }

        if (index !== undefined) {
          for (let i = 0; i < index.count; i += 3) {
            faces.push({
              a: index.getX(i),
              b: index.getX(i + 1),
              c: index.getX(i + 2),
            });
          }
        } else {
          for (let i = 0; i < position.count; i += 3) {
            faces.push({
              a: i,
              b: i + 1,
              c: i + 2,
            });
          }
        }

        return {
          vertices,
          faces,
        };
      };

      const createGImpactCollision = (mesh, scale, margin) => {
        let faces, vertices;
        let totvert = 0;

        if (mesh.isMesh) {
          let data = getMeshData(mesh);

          faces = data.faces;
          vertices = data.vertices;

          totvert = vertices.length;
        } else {
          console.error("cannot make mesh shape for non-Mesh object");
        }

        if (totvert == 0) {
          console.error("no vertices to define mesh shape with");
        }

        if (!scale) scale = { x: 1, y: 1, z: 1 };

        /* vertices, faces */
        let ammoMesh = new Ammo.btTriangleMesh();

        for (let i = 0, l = faces.length; i < l; i++) {
          let a = faces[i].a;
          let b = faces[i].b;
          let c = faces[i].c;
          ammoMesh.addTriangle(
            new Ammo.btVector3(vertices[a].x, vertices[a].y, vertices[a].z),
            new Ammo.btVector3(vertices[b].x, vertices[b].y, vertices[b].z),
            new Ammo.btVector3(vertices[c].x, vertices[c].y, vertices[c].z),
            false,
          );
        }

      
        /*
        if (useConvex) {
          return new Ammo.btGImpactMeshShape(ammoMesh);
        } else {
          return new Ammo.btBvhTriangleMeshShape(ammoMesh);
        }
        */

        //let triangleShape = new Ammo.btBvhTriangleMeshShape(ammoMesh);
        let triangleShape = new Ammo.btGImpactMeshShape(ammoMesh);
        triangleShape.setMargin(margin || 0.01);
        triangleShape.setLocalScaling(new Ammo.btVector3(scale.x, scale.y, scale.z));
        triangleShape.updateBound();

        return triangleShape;
      };

      const addObjPhysics = (obj, isStatic, offset, impactObj, margin) => {
        const pos = new THREE.Vector3();
        const quat = new THREE.Quaternion();
        if (impactObj) {
          pos.copy(obj.position);
          if (offset) {
            pos.add(offset);
          }
          quat.copy(obj.quaternion);
          // TODO scale
          //const shape = new Ammo.btBoxShape(new Ammo.btVector3(.5,.5,.5));
          //const shape = createGImpactCollision(impactObj, undefined, margin);


          
          // TODO handle obj is group
          const { position } = impactObj.geometry.attributes;
          const shape = new Ammo.btConvexHullShape();
          console.log('adding obj with', position.count, 'vert');
          for (let i = 0; i < position.count; i++) {
            shape.addPoint(new Ammo.btVector3(position.getX(i), position.getY(i), position.getZ(i)), true);
          }
          //pos.y += 0.5
          //createRigidBody(obj, createGImpactCollision(obj), 1, pos, quat);
          createRigidBody(obj, shape, 1, pos, quat);
          return;
        }
        obj.traverse(node => {
          if (!node.isMesh) {
            return;
          }
          pos.copy(node.position)
          if (offset) {
            pos.add(offset);
          }
          quat.copy(node.quaternion);

          const trimesh = createGImpactCollision(node, undefined, margin);
          const body = createRigidBody(node, trimesh, 0, pos, quat);
          body.setCollisionFlags(body.getCollisionFlags() | 1/* CF_STATIC_OBJECT */);
        });
      };

      const ambientColor = 0xaaaaaa; //  0xeeeeee; //0xfad5a5; ;
      const fogFar = 22; // 15; // 50;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(ambientColor);
      scene.fog = new THREE.Fog(ambientColor, 0, fogFar);

      const camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.rotation.order = "YXZ";

      const fillLight1 = new THREE.HemisphereLight(0x8dc1de, 0x00668d, 1.5);
      fillLight1.position.set(2, 1, 1);
      scene.add(fillLight1);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 2.5);
      directionalLight.position.set(-5, 25, -1);
      directionalLight.castShadow = true;
      directionalLight.shadow.camera.near = 0.01;
      directionalLight.shadow.camera.far = 500;
      directionalLight.shadow.camera.right = 30;
      directionalLight.shadow.camera.left = -30;
      directionalLight.shadow.camera.top = 30;
      directionalLight.shadow.camera.bottom = -30;
      directionalLight.shadow.mapSize.width = 1024;
      directionalLight.shadow.mapSize.height = 1024;
      directionalLight.shadow.radius = 4;
      directionalLight.shadow.bias = -0.00006;
      scene.add(directionalLight);

      const ambLight = new THREE.AmbientLight(ambientColor);
      scene.add(ambLight);

      const container = document.getElementById("container");

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.VSMShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      container.appendChild(renderer.domElement);

      const stats = new Stats();
      stats.domElement.style.position = "absolute";
      stats.domElement.style.top = "0px";
      container.appendChild(stats.domElement);

      const crosshair = document.createElement("div");
      Object.assign(crosshair.style, {
        background: "red",
        width: "5px",
        height: "5px",
        borderRadius: "500px",
        position: "absolute",
        left: "calc(50% - 2.5px)",
        top: "calc(50% - 2.5px)",
      });
      container.appendChild(crosshair);

      const prompt = document.createElement("textarea");
      prompt.id = "prompt";
      prompt.oninput = () => {
        prompt.style.height = 0;
        prompt.style.height = `${prompt.scrollHeight}px`;
      };
      prompt.onkeydown = (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          e.target.blur();
          prompt.classList.remove("prompt-active");
          fetch("/", { method: "POST", body: e.target.value });
        }
      };

      document.addEventListener("pointerlockchange", () => {
        if (document.pointerLockElement === null && document.activeElement === prompt) {
          prompt.blur();
          prompt.classList.remove("prompt-active");
        }
      });
      container.appendChild(prompt);

      const GRAVITY = 30;

      const STEPS_PER_FRAME = 1;

      // TODO can we revert moving the declaration of these
      let playerCollider, playerVelocity, playerDirection, playerOnFloor;

      const setupPlayerPhysics = () => {
        const geometry = new THREE.CapsuleGeometry( 0.35, 1 );
        const material = new THREE.MeshBasicMaterial( {color: 0x00ff00} ); 
        playerCollider = new THREE.Mesh( geometry, material );

        playerVelocity = new THREE.Vector3();
        playerDirection = new THREE.Vector3();

        playerOnFloor = false;

        const pos = { x: 0, y: 0.5, z: 0 };
        const quat = { x: 0, y: 0, z: 0, w: 1 };
        const mass = 1;

        // TODO revisit capsule shape
        const playerShape = new Ammo.btBoxShape(new Ammo.btVector3(.4, .4, .4));
        createRigidBody(playerCollider, playerShape, mass, pos, quat);
      };
      let mouseTime = 0;
      let pointerLocking = false;
      let updatePosition = 0;
      let selectionMode = "region";
      const createdObjects = new Map();
      const aliasedObjects = new Map();
      const activeTooltips = new Map();
      const doorIndicators = new Map();
      const activeMarkers = [];

      const keyStates = {};

      document.addEventListener("keydown", (event) => {
        if (event.code === "Slash") {
          if (activeMarkers.length === 1) {
            let { x, z } = activeMarkers[0];
            [x, z] = [x, z].map((v) => Math.round(v * 10));
            let ry = Math.round((camera.rotation.y / Math.PI) * 180) % 360;
            ry = ry < 0 ? 360 + ry : ry;
            showPrompt("/create ", ` --x ${x} --z ${z} --ry ${ry}`);
          } else {
            showPrompt(
              "/",
              activeMarkers.length
                ? ` --xz '${[...activeMarkers, activeMarkers[0]]
                    .map(({ x, z }) => `${Math.round(x * 10)},${Math.round(z * 10)}`)
                    .join(" ")}'`
                : "",
            );
          }
          event.preventDefault();
        } else if (event.code === "KeyC") {
          // TODO - selection clear key
          clearMarkers();
        } else if (event.code === "KeyO") {
          selectionMode = "object";
        } else if (event.code === "KeyR") {
          selectionMode = "region";
        } else if (event.code === "KeyI") {
          if (doorIndicators.size > 0) {
            const firstObj = doorIndicators.values()[Symbol.iterator]().next().value;
            const isAdded = Boolean(firstObj.parent);
            for (const obj of doorIndicators.values()) {
              if (isAdded) {
                scene.remove(obj);
              } else {
                scene.add(obj);
              }
            }
          }
        } else if (document.activeElement?.value === undefined) {
          keyStates[event.code] = true;
        }
      });

      document.addEventListener("keyup", (event) => {
        if (document.activeElement?.value === undefined) {
          keyStates[event.code] = false;
        }
      });

      container.addEventListener("mousedown", () => {
        if (document.pointerLockElement === null) pointerLocking = true;

        document.body.requestPointerLock();

        mouseTime = performance.now();
      });

      document.addEventListener("mouseup", () => {
        if (document.pointerLockElement !== null && !pointerLocking) handleClick();

        pointerLocking = false;
      });

      document.body.addEventListener("mousemove", (event) => {
        if (document.pointerLockElement === document.body) {
          camera.rotation.y -= event.movementX / 500;
          camera.rotation.x -= event.movementY / 500;
        }

        if (activeMarkers.length) {
          const { point } = getSelectedLocation();
          const y = activeMarkers.mesh.position.y - 0.01;
          if (point) {
            const lastMarker = activeMarkers.at(-1);
            const firstMarker = activeMarkers[0];
            const lastVec = new THREE.Vector3(lastMarker.x, y, lastMarker.z);
            const firstVec = new THREE.Vector3(firstMarker.x, y, firstMarker.z);
            const firstDir = new THREE.Vector3(point.x, y, point.z).sub(firstVec).normalize();
            const lastDir = new THREE.Vector3(point.x, y, point.z).sub(lastVec).normalize();

            firstVec.addScaledVector(firstDir, 0.01);
            lastVec.addScaledVector(lastDir, 0.01);

            if (activeMarkers.guide) {
              scene.remove(activeMarkers.guide);
              activeMarkers.guide = null;
            }

            let found = false;
            raycaster.set(firstVec, firstDir);
            found = raycaster.intersectObject(activeMarkers.mesh, false).length > 0;
            raycaster.set(lastVec, lastDir);
            found = found || raycaster.intersectObject(activeMarkers.mesh, false).length > 0;

            if (!found) {
              const guideMat = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                side: THREE.DoubleSide,
              });
              guideMat.transparent = true;
              guideMat.opacity = 0.2;

              activeMarkers.guide = createPolygonHighlight(
                [firstMarker, point, lastMarker],
                guideMat,
              );
              scene.add(activeMarkers.guide);
            }
          }
        }
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      pointer.x = 0;
      pointer.y = 0;

      const loadObjModel = async (name, { useVertexColors = false } = {}) => {
        const slashIdx = name.lastIndexOf("/");
        const [path, modelName] =
          slashIdx === -1
            ? ["", name]
            : [name.slice(0, slashIdx + 1), name.slice(slashIdx + 1)];
        return new Promise((resolve) => {
          const handleObj = (obj) => {
            if (useVertexColors) {
              obj.traverse((node) => {
                if (node.material) {
                  node.material.emissive = new THREE.Color(0.01, 0.01, 0.01);
                  node.material.vertexColors = true;
                }
              });
            }
            resolve(obj);
          };

          new MTLLoader().setPath(path).load(
            `${modelName.slice(0, -4)}.mtl`,
            (materials) => {
              materials.preload();
              new OBJLoader().setMaterials(materials).setPath(path).load(modelName, handleObj);
            },
            undefined,
            () => {
              new OBJLoader().setPath(path).load(modelName, handleObj);
            },
          );
        });
      };

      const getSelectedLocation = () => {
        raycaster.setFromCamera(pointer, camera);

        const intr = raycaster
          .intersectObjects(scene.children)
          .find(
            (i) =>
              i.object.isMesh &&
              i.object !== activeMarkers.mesh &&
              i.object !== activeMarkers.guide,
          );

        if (!intr) {
          return { point: null, object: null };
        }

        const xzNorm = intr.face.normal.clone();
        xzNorm.y = 0;
        xzNorm.clampLength(0, 0.025);
        const point = intr.point.clone().add(xzNorm);

        return { point, object: intr.object };
      };

      const clearMarkers = () => {
        activeMarkers.length = 0;
        if (activeMarkers.mesh) {
          scene.remove(activeMarkers.mesh);
          delete activeMarkers.mesh;
        }
        if (activeMarkers.guide) {
          scene.remove(activeMarkers.guide);
          delete activeMarkers.guide;
        }
      };

      const createMarkerSprite = (x, z) => {
        const canv = document.createElement("canvas");
        canv.width = 25;
        canv.height = 250;
        const texture = new THREE.CanvasTexture(canv);
        const material = new THREE.SpriteMaterial({ map: texture });

        const ctx = canv.getContext("2d");
        ctx.scale(2, 2);

        ctx.fillStyle = ctx.strokeStyle = "rgb(0 170 204)";
        ctx.lineWidth = 4;

        ctx.beginPath();
        ctx.arc(8, 119, 4, 0, 2 * Math.PI);
        ctx.fill();
        ctx.arc(8, 119, 16, -Math.PI, 2 * Math.PI);
        //ctx.moveTo(6, 119);
        //ctx.lineTo(6, 0);
        ctx.stroke();

        const sprite = new THREE.Sprite(material);

        sprite.center.set(0.5, 0);
        sprite.scale.set(0.05, 0.5, 1);
        sprite.position.set(x, -1, z);
        return sprite;
      };

      const createTooltipSprite = (x, z) => {
        const canv = document.createElement("canvas");
        canv.width = 1000;
        canv.height = 1000;
        canv.getContext("2d").scale(2, 2);
        const texture = new THREE.CanvasTexture(canv);
        const material = new THREE.SpriteMaterial({ map: texture });

        const sprite = new THREE.Sprite(material);
        sprite.center.set(0.01, 0);
        sprite.position.set(x, -1, z);
        sprite.scale.set(2, 2, 1);
        return [sprite, canv, texture];
      };

      const createPolygonHighlight = (points, material = null) => {
        if (points.length === 1) {
          return createMarkerSprite(points[0].x, points[0].z);
        }
        if (!material || typeof material === "number") {
          material = new THREE.MeshBasicMaterial({
            color: material || 0x00ffff,
            side: THREE.DoubleSide,
          });
          material.transparent = true;
          material.opacity = 0.5;
        }

        const shape = new THREE.Shape();

        shape.moveTo(points[0].x, points[0].z);

        for (let i = 1; i < points.length; i++) {
          shape.lineTo(points[i].x, points[i].z);
        }

        const height = Math.max(...points.map(({ y }) => y + 1.05)); // REVIEW

        const geometry = new THREE.ExtrudeGeometry(shape, {
          steps: 1,
          depth: height,
          bevelEnabled: false,
        });

        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.y = height - 0.999;
        mesh.rotation.x = Math.PI / 2;

        return mesh;
      };

      const formatWithTiming = (msg, startTime, multiline) => {
        const elapsedMs = Date.now() - startTime;
        const elapsedMin = Math.floor(elapsedMs / 60_000);
        const elapsedSec = Math.round((elapsedMs % 60_000) / 1000);
        const elapsedStr = `${elapsedMin ? `${elapsedMin}m` : ""}${elapsedSec}s${
          multiline ? "\n" : " \xb7 "
        }`;
        return `${elapsedStr}${msg}`;
      };

      const drawTooltip = ({ canvas, msg, img, texture, startTime }) => {
        const fullMsg = formatWithTiming(msg, startTime);
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, 500, 500);

        ctx.strokeStyle = "rgb(0 170 204)";
        //ctx.fillStyle = 'rgb(0 170 204 / 0.4)';
        ctx.fillStyle = "rgb(20 45 50  / 0.8)";
        ctx.lineWidth = 4;

        ctx.beginPath();
        ctx.moveTo(30, 348);
        ctx.lineTo(38, 302);
        ctx.lineTo(498, 302);
        ctx.lineTo(490, 348);
        ctx.fill();
        //ctx.stroke();

        ctx.beginPath();
        ctx.fillStyle = "rgb(0 255 255)";
        ctx.font = "28px monospace";
        ctx.letterSpacing = "-0.5px";
        ctx.fillText(fullMsg, 44, 338);
        ctx.fillStyle = ctx.strokeStyle;
        ctx.arc(6, 494, 4, 0, 2 * Math.PI);
        ctx.fill();
        ctx.moveTo(6, 494);
        ctx.lineTo(30, 348);
        ctx.lineTo(490, 348);
        ctx.stroke();

        if (img) {
          // TODO assumes square
          ctx.drawImage(img, 144, 40, 260, 260);
        }

        texture.needsUpdate = true;
      };

      const showPrompt = (preCmd, postCmd) => {
        prompt.value = `${preCmd}${postCmd}`;
        prompt.selectionStart = prompt.selectionEnd = preCmd.length;
        prompt.focus();
        prompt.classList.add("prompt-active");
        prompt.style.height = 0;
        prompt.style.height = `${prompt.scrollHeight}px`;
      };

      const wallTexture = new THREE.TextureLoader().load("models/obj/level.png");
      wallTexture.wrapS = THREE.RepeatWrapping;
      wallTexture.wrapT = THREE.RepeatWrapping;

      const createWallMessage = (aspectRatio) => {
        const canv = document.createElement("canvas");
        canv.height = 200;
        canv.width = 200 * aspectRatio;

        const tex = new THREE.CanvasTexture(canv);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;

        return [canv, tex];
      };

      const drawWallMessage = ({ canvas, msg, texture, startTime }) => {
        const fullMsg = formatWithTiming(msg, startTime, true);
        const ctx = canvas.getContext("2d");
        for (let x = 0; x < canvas.width; x += 200) {
          ctx.drawImage(wallTexture.image, x, 0, 200, 200);
        }
        ctx.fillStyle = "rgb(0 255 255)";
        ctx.font = "20px monospace";
        ctx.letterSpacing = "-0.5px";
        for (let x = 0; x < canvas.width; x += 600) {
          ctx.fillText(fullMsg, 20 + x, 25);
        }

        texture.needsUpdate = true;
      };

      const handleClick = () => {
        const { point, object } = getSelectedLocation();
        if (!point) {
          return;
        }
        // TODO: search for physics body more generally
        const physicsBody = object.userData.physicsBody || object.parent.userData.physicsBody;
        if (physicsBody?.applyImpulse) {
          // TODO: better implementation of fooming
          const { x, y, z } = getForwardVector().multiplyScalar(40);
          physicsBody.applyImpulse(new Ammo.btVector3(x, y, z));
          //return; // REVIEW: is this intuitive enough? // FIXME - even the ground is a physics mesh
        }
        activeMarkers.push(point);
        if (activeMarkers.mesh) {
          scene.remove(activeMarkers.mesh);
        }
        activeMarkers.mesh = createPolygonHighlight(activeMarkers);
        scene.add(activeMarkers.mesh);
      };

      const updatePhysics = (deltaTime) => {
        physicsWorld.stepSimulation(deltaTime, 10);

        for (let i = 0; i < rigidBodies.length; i++) {
          const objThree = rigidBodies[i];
          const objAmmo = objThree.userData.physicsBody;
          const ms = objAmmo.getMotionState();
          if (ms) {
            ms.getWorldTransform(transformAux1);
            const p = transformAux1.getOrigin();
            const q = transformAux1.getRotation();
            objThree.position.set(p.x(), p.y(), p.z());
            objThree.quaternion.set(q.x(), q.y(), q.z(), q.w());
          }
        }
      };

      const updatePlayer = (deltaTime) => {
        // REVIEW - aider added this but I think it's handled by controls?
        // const speed = 5;
        // const moveX = (keyStates["KeyA"] ? -1 : 0) + (keyStates["KeyD"] ? 1 : 0);
        // const moveZ = (keyStates["KeyW"] ? -1 : 0) + (keyStates["KeyS"] ? 1 : 0);
        //
        // playerVelocity.set(moveX * speed, playerVelocity.y, moveZ * speed);

        const playerBody = playerCollider.userData.physicsBody;
        const playerTransform = playerBody.getWorldTransform();
        const playerPos = playerTransform.getOrigin();
        /*
        playerPos.setX(playerPos.x() + playerVelocity.x * deltaTime);
        playerPos.setY(playerPos.y() + playerVelocity.y * deltaTime);
        playerPos.setZ(playerPos.z() + playerVelocity.z * deltaTime);
        playerTransform.setOrigin(playerPos);

        playerBody.setWorldTransform(playerTransform);
        */

        const objVel = playerBody.getLinearVelocity();
        const velocity = new Ammo.btVector3(playerVelocity.x, objVel.y(), playerVelocity.z);
        playerBody.setLinearVelocity(velocity);

        if (playerVelocity.y > 0) {
          playerBody.applyImpulse(new Ammo.btVector3(0, playerVelocity.y, 0));
        }

        // FIXME
        playerOnFloor = playerPos.y() < -0.2;

        // DEBUG
        window.__playerOnFloor = playerOnFloor;

        camera.position.set(playerPos.x(), playerPos.y() + 0.5, playerPos.z());
      };

      const getForwardVector = () => {
        camera.getWorldDirection(playerDirection);
        playerDirection.y = 0;
        playerDirection.normalize();

        return playerDirection;
      };

      const getSideVector = () => {
        camera.getWorldDirection(playerDirection);
        playerDirection.y = 0;
        playerDirection.normalize();
        playerDirection.cross(camera.up);

        return playerDirection;
      };

      const controls = (deltaTime) => {
        playerVelocity.set(0, 0, 0);

        // gives a bit of air control
        const speedDelta = /*deltaTime */ (playerOnFloor ? 10 : 2);

        if (keyStates["KeyW"]) {
          playerVelocity.add(getForwardVector().multiplyScalar(speedDelta));
        }

        if (keyStates["KeyS"]) {
          playerVelocity.add(getForwardVector().multiplyScalar(-speedDelta));
        }

        if (keyStates["KeyA"]) {
          playerVelocity.add(getSideVector().multiplyScalar(-speedDelta));
        }

        if (keyStates["KeyD"]) {
          playerVelocity.add(getSideVector().multiplyScalar(speedDelta));
        }

        if (playerOnFloor) {
          if (keyStates["Space"]) {
            playerVelocity.y = 1.2;
          }
        }
      };

      const loadLevel = async () => {
        const levelObj = await loadObjModel("models/obj/level.obj");

        levelObj.traverse((node) => {
          if (node.material) {
            node.material.transparent = true;
            node.material.opacity = 0.33;
          }
        });

        addObjPhysics(levelObj, true);

        scene.add(levelObj);

        scheduleUpdate();

        animate();
      };

      const teleportPlayerIfOob = () => {
        if (camera.position.y <= -25) {
          playerCollider.position.set(0, 0, 0); // REVIEW - updated from Capsule days
          camera.position.copy(playerCollider.position);
          camera.rotation.set(0, 0, 0);
        }
      };

      const animate = () => {
        const deltaTime = Math.min(0.05, clock.getDelta());

        controls(deltaTime);

        updatePlayer(deltaTime);

        teleportPlayerIfOob();

        updatePhysics(deltaTime);
        renderer.render(scene, camera);

        stats.update();

        requestAnimationFrame(animate);
        //setTimeout(() => requestAnimationFrame(animate), updateMs);
      };

      const redrawTooltips = () => {
        for (const [id, tooltip] of activeTooltips) {
          if (tooltip.type === "tooltip") {
            drawTooltip(tooltip);
          } else {
            drawWallMessage(tooltip);
          }
        }
      };

      const handleUpdates = async (updates) => {
        if (!updates.length) {
          redrawTooltips();
          return;
        }

        updatePosition += updates.length;

        const initialObjCount = createdObjects.size;

        for (const [id, cmd, type, data] of updates) {
          console.log(id, cmd, type, data);
          if (cmd === "del") {
            // REVIEW
            if (createdObjects.has(id)) {
              scene.remove(createdObjects.get(id));
            }
            activeTooltips.delete(id);
            doorIndicators.delete(id);
            continue;
          }
          let newObj, newTooltip;
          let isTooltip = false;
          let isRoomSurface =
            type === "wall" || type === "door" || type === "ceil" || type === "floor";
          if (type === "msg") {
            let img = null;
            if (data.img) {
              img = new Image();
              await new Promise((resolve, reject) => {
                img.onload = resolve;
                img.onerror = reject;
                img.src = data.img;
              });
            }
            if (activeTooltips.has(id)) {
              newTooltip = {
                ...activeTooltips.get(id),
                msg: data.msg,
                img,
              };
            } else {
              let canvas, texture;
              [newObj, canvas, texture] = createTooltipSprite(data.x / 10, data.z / 10);
              newTooltip = {
                type: "tooltip",
                startTime: Date.now(),
                canvas,
                texture,
                msg: data.msg,
                img,
              };
            }
          } else if (type === "obj" || isRoomSurface) {
            newObj = await loadObjModel(
              data.obj,
              { useVertexColors: type === "obj" }
            );

            const simpObj = type === 'obj'
              ? await loadObjModel(data.obj.replace(/\.obj$/, '.simp.obj'), { useVertexColors: true })
              : null;

            // TEMP DEBUG
            /*
            if (!isRoomSurface) {
              newObj = meshToConvexHull(newObj.children[0], 4)
            }
            */

            newObj.position.set(data.x / 10, isRoomSurface ? -0.999 : 0, data.z / 10);
            newObj.rotation.set(0, 0, 0);
            if (type === "obj" && data.scale) {
              newObj.scale.set(data.scale, data.scale, data.scale);
            }
            if (type === "door") {
              const xzs = data.path.map(([x, z]) => [x / 10, z / 10]);
              const start = xzs[0];
              const end = xzs.at(-2);
              const doorVec = new THREE.Vector2(...end).sub(new THREE.Vector2(...start));
              const doorNorm = new THREE.Vector2(doorVec.y, -doorVec.x)
                .normalize()
                .multiplyScalar(0.6);
              const xzPath = [
                new THREE.Vector2(...start).add(doorNorm),
                new THREE.Vector2(...end).add(doorNorm),
                new THREE.Vector2(...end).addScaledVector(doorNorm, -1),
                new THREE.Vector2(...start).addScaledVector(doorNorm, -1),
              ];
              const indicator = createPolygonHighlight(
                xzPath.map(({ x, y: z }) => ({ x, y: -0.99, z })),
                0xdd2222,
              );
              doorIndicators.set(id, indicator);
            }
            if (isRoomSurface) {
              if (data.msg) {
                if (activeTooltips.has(id)) {
                  newTooltip = {
                    ...activeTooltips.get(id),
                    msg: data.msg,
                  };
                } else {
                  let [canvas, texture] = createWallMessage(12);
                  newTooltip = {
                    type: "wall",
                    startTime: Date.now(),
                    canvas,
                    texture,
                    msg: data.msg,
                  };
                }
                newObj.traverse((node) => {
                  if (node.material) {
                    node.material.map = newTooltip.texture;
                  }
                });
              } else {
                newObj.traverse((node) => {
                  if (node.material && !node.material.map) {
                    node.material.map = wallTexture;
                  }
                });
              }
            }
            if (data.ry) {
              newObj.rotateY((data.ry * Math.PI) / 180);
            }
            addObjPhysics(newObj, isRoomSurface, new THREE.Vector3(0, isRoomSurface ? -0.999 : 0, 0),
              simpObj && meshToConvexHull(simpObj.children[0]),
              type === 'wall' || type === 'door' ? 0.1 : undefined);
          } else if (type === "alias") {
            aliasedObjects.set(id, data);
          }
          if (newObj) {
            if (createdObjects.has(id)) {
              console.log('removing', id);
              removeRigidBody(createdObjects.get(id));
              scene.remove(createdObjects.get(id));
            }
            createdObjects.set(id, newObj);
            scene.add(newObj);
          }
          if (newTooltip) {
            activeTooltips.set(id, newTooltip);
            if (newTooltip.type === "tooltip") {
              drawTooltip(newTooltip);
            } else {
              drawWallMessage(newTooltip);
            }
          } else {
            activeTooltips.delete(id);
          }
        }

        // REVIEW - handle aliases
        // TODO physics for aliases
        for (const [id, data] of aliasedObjects) {
          if (createdObjects.has(data.id)) {
            const newObj = createdObjects.get(data.id).clone();
            newObj.position.x = data.x / 10;
            newObj.position.z = data.z / 10;

            newObj.rotation.set(0, 0, 0);
            newObj.rotateY((data.ry * Math.PI) / 180);

            // TODO avoid duplication with first run
            if (createdObjects.has(id)) {
              removeRigidBody(createdObjects.get(id));
              scene.remove(createdObjects.get(id));
            }
            createdObjects.set(id, newObj);
            scene.add(newObj);
          }
        }

        redrawTooltips();
      };

      const scheduleUpdate = () =>
        setTimeout(() => {
          if (document.hidden) {
            scheduleUpdate();
          } else {
            fetch(`/world?after=${encodeURIComponent(updatePosition)}`)
              .then((r) => r.json())
              .then(async (updates) => {
                await handleUpdates(updates);
                scheduleUpdate();
              });
          }
        }, 1000);
    </script>
  </body>
</html>
